name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build application
      - name: Build application
        run: ./mvnw clean package -DskipTests

      # 4. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 5. Copy JAR to EC2
      - name: Copy application to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
          target/*.jar \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app.jar

      # 6. Restart application
      - # 6. Restart application
      - name: Restart application
        run: |
          ssh -i ~/.ssh/ec2_key \
          ubuntu@${{ secrets.EC2_HOST }} \
          "pkill -9 -f 'java -jar' || true; sleep 3; nohup java -jar /home/ubuntu/app.jar > /home/ubuntu/app.log 2>&1 &"